<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MIYO — Make It Yours. A student exchange connecting Hanoi and Kaohsiung.">
  <meta name="theme-color" content="#f1efe9">
  <title>MIYO — Make It Yours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --paper: #f1efe9; --ink: #191b1b; --muted: #777772; --accent: #a24f38; --blue: #334f60; --mono: "DM Mono", monospace; --display: "Space Grotesk", sans-serif; --sans: "DM Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; margin: 0; padding: 32px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1040px); }
    .banner { position: relative; display: flex; min-height: min(58vh, 480px); flex-direction: column; justify-content: space-between; overflow: hidden; padding: clamp(28px, 6vw, 72px); border: 1px solid rgba(25, 27, 27, .2); background: radial-gradient(ellipse at 85% 20%, rgba(51, 79, 96, .12), transparent 40%), #e8e5dd; color: inherit; text-decoration: none; }
    .banner::after { position: absolute; right: -5%; bottom: -44%; width: min(48vw, 520px); aspect-ratio: 1; border: 1px solid rgba(51, 79, 96, .2); border-radius: 50%; content: ""; box-shadow: 0 0 0 32px rgba(51,79,96,.025), 0 0 0 64px rgba(51,79,96,.025), 0 0 0 96px rgba(51,79,96,.025); pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--muted); font: 500 10px/1.5 var(--mono); letter-spacing: .14em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(162,79,56,.12); }
    h1 { position: relative; z-index: 1; max-width: 750px; margin: 50px 0 25px; font: 500 clamp(60px, 12vw, 142px)/.86 var(--display); letter-spacing: -.105em; }
    h1 em { color: var(--accent); font: italic 400 1em/.9 Georgia, serif; letter-spacing: -.08em; }
    .bottom { position: relative; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .bottom p { max-width: 430px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .open { display: flex; align-items: center; gap: 30px; font: 400 10px/1.5 var(--mono); letter-spacing: .12em; }
    .arrow { color: var(--accent); font-size: 22px; transition: transform .2s; }
    .banner:hover .arrow { transform: translate(4px, -4px); }
    .actions { display: flex; justify-content: flex-end; padding-top: 22px; }
    .button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid var(--ink); color: var(--ink); font-size: 12px; text-decoration: none; transition: background .2s, color .2s; }
    .button:hover { background: var(--ink); color: var(--paper); }
    @media (max-width: 600px) { body { padding: 16px; } .banner { min-height: 62svh; padding: 28px 24px; } h1 { margin: 50px 0 24px; font-size: clamp(58px, 16vw, 90px); } .bottom { align-items: flex-start; flex-direction: column; } .actions { justify-content: stretch; } .button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <a class="banner" href="neededaccess/miyo/" aria-label="Open the MIYO website">
      <span class="eyebrow"><span class="dot" aria-hidden="true"></span> TWO CITIES, ONE CONNECTION</span>
      <h1>Make it<br><em>yours.</em></h1>
      <span class="bottom"><p>A student exchange connecting Hanoi and Kaohsiung. Step inside the MIYO story.</p><span class="open">EXPLORE MIYO <span class="arrow" aria-hidden="true">↗</span></span></span>
    </a>
    <div class="actions"><a class="button" href="applications/">Open participant applications&nbsp; ↗</a></div>
  </main>
</body>
</html>
