<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Make It Yours — dự án giao lưu Hà Nội × Cao Hùng 2026.">
  <title>MIYO — Make It Yours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --bg:#f3f4f1; --ink:#12171f; --muted:#6b717b; --blue:#2a3cff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:17px/1.6 "DM Sans",system-ui,sans-serif; }
    main { width:min(100% - 40px, 960px); min-height:100vh; margin:auto; display:flex; flex-direction:column; }
    header { padding:28px 0; border-bottom:1px solid #d5d8d2; font-weight:800; letter-spacing:.04em; }
    .hero { flex:1; display:flex; flex-direction:column; justify-content:center; padding:72px 0; }
    .eyebrow { color:var(--blue); font-size:13px; font-weight:700; letter-spacing:.12em; }
    h1 { max-width:800px; margin:16px 0; font:800 clamp(56px,12vw,120px)/.9 "Bricolage Grotesque",sans-serif; letter-spacing:-.06em; }
    h1 span { color:var(--blue); }
    .intro { max-width:560px; color:var(--muted); font-size:clamp(18px,3vw,22px); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .button { display:inline-block; padding:14px 22px; border:2px solid var(--ink); border-radius:12px; background:var(--ink); color:white; font-weight:700; text-decoration:none; }
    .button.secondary { background:transparent; color:var(--ink); }
    footer { padding:20px 0; border-top:1px solid #d5d8d2; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <header>MIYO · MAKE IT YOURS</header>
    <section class="hero" aria-labelledby="title">
      <p class="eyebrow">HANOI × KAOHSIUNG · 2026</p>
      <h1 id="title">MAKE<br><span>IT</span> YOURS.</h1>
      <p class="intro">Một dự án kết nối những người bạn Hà Nội và Cao Hùng. Cùng chia sẻ đôi điều về bản thân để chúng ta hiểu nhau hơn trước ngày gặp lại.</p>
      <div class="actions">
        <a class="button" href="questions/">Điền thông tin / Questions</a>
        <a class="button secondary" href="questions/">Make It Yours</a>
      </div>
    </section>
    <footer>MAKE IT YOURS · HANOI × KAOHSIUNG 2026</footer>
  </main>
</body>
</html>
