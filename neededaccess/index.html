  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
  <main class="gate">
    <header class="topline"><a class="brand" href="../" aria-label="MIYO home">MIYO<span>.</span></a><p><i aria-hidden="true"></i> A LITTLE CLOSER, SOON</p></header>
    <section class="message" aria-labelledby="title">
      <div class="message-copy">
        <p class="eyebrow"><span class="eyebrow-index">06 — KEEP IN TOUCH</span><span class="eyebrow-contact">CONTACT</span></p>
        <p class="kicker">TWO CITIES, STILL IN THE MAKING</p>
        <h1 id="title">More, <em>soon.</em></h1>
        <p class="description">For help or questions, contact the developer on Zalo: 0335695572.</p>
        <button class="admin-toggle" id="adminToggle" type="button" aria-expanded="false" aria-controls="adminPanel">Admin access <span aria-hidden="true">↗</span></button>
        <a class="return-link" href="../"><span aria-hidden="true">←</span> Return</a>
        <form class="admin-panel" id="adminForm" hidden>
          <label for="adminCode">Admin code</label>
          <div class="password-row"><div class="password-field"><input id="adminCode" type="password" autocomplete="off" required><button class="visibility-toggle" id="toggleCodeVisibility" type="button" aria-label="Show admin code" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/><path class="eye-slash" d="m4 4 16 16"/></svg></button></div><button type="submit" id="adminSubmit">Enter <span aria-hidden="true">↗</span></button></div>
          <p class="message-error" id="adminMessage" role="alert" hidden></p>
        </form>
      </div>
    </section>
    <footer><span>MAKE IT YOURS</span><span>MIYO — AN EXCHANGE IN MOTION</span></footer>
  </main>
  <script src="../shared/miyo-config.js" defer></script>
  <script src="gate.js" defer></script>
  <script src="../shared/miyo-chat.js" defer></script>
